# PiBook experimental parallel early e-paper splash.
# param.conf e' sourced varias vezes; executar apenas uma.

if [ ! -e /run/pibook-early-splash-done ]; then
    : > /run/pibook-early-splash-done

    if [ -x /scripts/init-top/pibook-early-splash-run ]; then
        /scripts/init-top/pibook-early-splash-run "$@" || true
    fi
fi
