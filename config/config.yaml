battery:
  adc_channel: 0
  auto_shutdown_enabled: true
  backend: waveshare_ups_hat_c
  backend_retry_interval: 15
  capacity_mah: 4000
  charge_calibrated_capacity_mah: 4142.5
  charge_current_threshold_ma: 20.0
  critical_consecutive_readings: 3
  critical_voltage: 3.5
  discharge_calibrated_capacity_mah: 4563.7
  discharge_current_threshold_ma: -20.0
  emergency_voltage: 3.35
  enabled: true
  ina219_address: 67
  ina219_bus: 1
  ina219_shunt_ohms: 0.01
  low_battery_threshold: 15
  max_voltage: 4.2
  min_voltage: 3.2
  rearm_voltage: 3.7
  safety_check_interval: 10
  safety_enabled: true
  show_percentage: true
  smoothing_samples: 5
  soc_max_integration_gap: 120
  soc_persist_interval: 600
  soc_persist_step: 0.5
  soc_restore_max_delta: 30
  soc_state_file: data/battery_state.json
  soc_state_stale_age: 21600
  status_check_interval: 30
  update_interval: 60
  voltage_divider_ratio: 2.0
  warning_consecutive_readings: 2
  warning_voltage: 3.62
display:
  clear_on_shutdown: true
  height: 800
  rotation: 90
  width: 480
gpio_config: config/gpio_mapping.yaml
keyboard:
  enabled: false
library:
  books_directory: books
  font_size: 20
  items_per_page: 4
logging:
  console: true
  file: logs/pibook.log
  level: INFO
  max_size: 5MB
performance:
  gc_threshold: 20
pisugar:
  button_enabled: false
  button_socket_path: /tmp/pibook-button.sock
  socket_path: /tmp/pisugar-server.sock
power:
  cpu_scaling: true
  mode: balanced
  single_core_reading: false
reader:
  page_cache_size: 5
  zoom: 1.0
reading_progress:
  enabled: true
  progress_file: data/reading_progress.json
  save_on_page_turn: true
  save_on_sleep: true
web:
  enabled: true
  port: 5000
  start_on_boot: true
