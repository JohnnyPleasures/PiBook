<div class="todo-page">
    <div class="library-page-header todo-page-header">
        <div>
            <h2>✓ To Do</h2>
            <p>Gere as tarefas do PiBook.</p>
        </div>

        <button
            class="btn btn-secondary todo-open-epaper"
            onclick="openTodoOnEpaper()"
        >
            Abrir no e-paper
        </button>
    </div>

    <div
        id="todo-status"
        class="message todo-status"
        style="display:none;"
    ></div>

    <div class="library-panel todo-add-panel">
        <div class="library-panel-content">
            <h3 class="todo-panel-title">Nova tarefa</h3>

            <div class="todo-add-form">
                <input
                    type="text"
                    id="new-task-input"
                    class="todo-new-input"
                    placeholder="Escreve uma tarefa…"
                    autocomplete="off"
                >

                <button
                    class="btn todo-add-btn"
                    onclick="addTodo()"
                >
                    ＋ Adicionar
                </button>
            </div>
        </div>
    </div>

    <div class="library-panel todo-list-panel">
        <div class="library-panel-content">
            <div class="todo-list-heading">
                <h3 class="todo-panel-title">Tarefas</h3>
            </div>

            <div id="todo-list" class="todo-list">
                <div class="todo-empty">
                    A carregar tarefas…
                </div>
            </div>
        </div>
    </div>
</div>
