<div class="terminal-v2">
    <div class="terminal-v2-header">
        <div>
            <h2>💻 Terminal</h2>
            <p>Executa comandos diretamente no PiBook.</p>
        </div>

        <div id="terminal-state" class="terminal-state terminal-state-idle">
            Pronto
        </div>
    </div>

    <div class="terminal-info">
        <strong>pi@pibook:~/PiBook</strong>
        <span>Terminal não-interativo · sem limite fixo de duração</span>
    </div>

    <section class="terminal-section">
        <div class="terminal-section-title">Atalhos</div>

        <div class="terminal-quick">
            <button type="button" class="btn btn-secondary"
                    data-command="systemctl status pibook-zero.service --no-pager -l"
                    onclick="setCommand(this.dataset.command)">
                Estado PiBook
            </button>

            <button type="button" class="btn btn-secondary"
                    data-command="journalctl -u pibook-zero.service -n 100 --no-pager"
                    onclick="setCommand(this.dataset.command)">
                Logs PiBook
            </button>

            <button type="button" class="btn btn-secondary"
                    data-command="ip -br addr; echo; nmcli -t -f DEVICE,TYPE,STATE,CONNECTION device status"
                    onclick="setCommand(this.dataset.command)">
                Rede
            </button>

            <button type="button" class="btn btn-secondary"
                    data-command="systemctl status pibook-network-watchdog.timer --no-pager; echo; journalctl -u pibook-network-watchdog.service -n 80 --no-pager"
                    onclick="setCommand(this.dataset.command)">
                Watchdog
            </button>

            <button type="button" class="btn btn-secondary"
                    data-command="df -h /"
                    onclick="setCommand(this.dataset.command)">
                Disco
            </button>

            <button type="button" class="btn btn-secondary"
                    data-command="free -h"
                    onclick="setCommand(this.dataset.command)">
                Memória
            </button>

            <button type="button" class="btn btn-secondary"
                    data-command="/home/pi/PiBook/scripts/test_buttons.sh"
                    onclick="setCommand(this.dataset.command)">
                Testar botões
            </button>

            <button type="button" class="btn terminal-restart-btn"
                    data-command="sudo systemctl restart pibook-zero.service"
                    onclick="setCommand(this.dataset.command)">
                Reiniciar PiBook
            </button>
        </div>
    </section>

    <section class="terminal-section">
        <div class="terminal-section-head">
            <div class="terminal-section-title">Comando</div>

            <div class="terminal-history-wrap">
                <select id="terminal-history" aria-label="Histórico de comandos">
                    <option value="">Histórico</option>
                </select>

                <button type="button"
                        class="terminal-mini-btn"
                        onclick="clearTerminalHistory()">
                    Apagar
                </button>
            </div>
        </div>

        <textarea id="terminal-input"
                  rows="7"
                  spellcheck="false"
                  autocapitalize="off"
                  autocomplete="off"
                  autocorrect="off"
                  placeholder="Cola aqui um comando ou um bloco com várias linhas..."></textarea>

        <div class="terminal-command-actions">
            <button type="button"
                    id="terminal-execute"
                    class="btn terminal-execute-btn"
                    onclick="executeCommand()">
                Executar
            </button>

            <button type="button"
                    id="terminal-stop"
                    class="btn btn-secondary terminal-stop-btn"
                    onclick="stopTerminalCommand()"
                    disabled>
                Parar
            </button>
        </div>

        <div class="terminal-hint">
            No PC: <strong>Ctrl+Enter</strong> executa. Enter normal cria uma nova linha.
        </div>
    </section>

    <section class="terminal-section">
        <div class="terminal-section-head">
            <div class="terminal-section-title">Output</div>

            <div class="terminal-output-actions">
                <button type="button"
                        class="terminal-mini-btn"
                        onclick="copyOutput()">
                    Copiar
                </button>

                <button type="button"
                        class="terminal-mini-btn"
                        onclick="clearTerminal()">
                    Limpar
                </button>
            </div>
        </div>

        <pre id="terminal-output" aria-live="polite">PiBook Terminal v2
Pronto para executar comandos.
</pre>
    </section>
</div>
