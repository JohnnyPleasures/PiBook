<div class="status-page">
    <div class="status-page-header">
        <h2>ℹ️ Estado</h2>
        <button
            class="status-refresh"
            type="button"
            onclick="refreshSystemStats()"
            title="Atualizar estado"
            aria-label="Atualizar estado"
        >↻</button>
    </div>

    <div class="status-primary-grid">
        <div class="status-card status-card-battery">
            <div class="status-card-label">Bateria</div>
            <div class="status-battery-main">
                <div id="battery-percentage" class="status-battery-value">—</div>
                <div class="status-battery-meta">
                    <div id="battery-state">A carregar...</div>
                    <div id="battery-electrical">—</div>
                    <div id="battery-runtime" class="status-battery-runtime"></div>
                </div>
            </div>
        </div>

        <div class="status-card">
            <div class="status-card-label">Energia</div>
            <div id="effective-power-profile" class="status-card-value">—</div>
        </div>

        <div class="status-card">
            <div class="status-card-label">Wi-Fi</div>
            <div id="wifi-status" class="status-card-value">—</div>
        </div>

        <div class="status-card">
            <div class="status-card-label">Bluetooth</div>
            <div id="bluetooth-status" class="status-card-value">—</div>
        </div>

        <div class="status-card">
            <div class="status-card-label">CPU</div>
            <div id="cpu-temp" class="status-card-value">—</div>
        </div>

        <div class="status-card">
            <div class="status-card-label">Ecrã</div>
            <div id="current-screen" class="status-card-value">—</div>
        </div>

        <div class="status-card">
            <div class="status-card-label">Ligado há</div>
            <div id="uptime" class="status-card-value">—</div>
        </div>
    </div>

    <details class="status-details">
        <summary>Detalhes do sistema</summary>

        <div class="status-details-grid">
            <div class="status-detail-row">
                <span>Modelo</span>
                <strong id="pi-model">—</strong>
            </div>

            <div class="status-detail-row">
                <span>Tensão CPU</span>
                <strong id="cpu-voltage">—</strong>
            </div>

            <div class="status-detail-row">
                <span>Frequência CPU</span>
                <strong id="cpu-speed">—</strong>
            </div>

            <div class="status-detail-row">
                <span>Alimentação / throttling</span>
                <strong id="throttle-status">—</strong>
            </div>

            <div class="status-detail-row">
                <span>Memória</span>
                <strong id="memory-usage">—</strong>
            </div>

            <div class="status-detail-row">
                <span>Espaço livre</span>
                <strong id="disk-free">—</strong>
            </div>

            <div class="status-detail-row status-detail-wide">
                <span>Sistema</span>
                <strong id="os-info">—</strong>
            </div>
        </div>
    </details>
</div>
